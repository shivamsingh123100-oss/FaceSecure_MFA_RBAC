{% extends "base.html" %}

{% block title %}404 | Page Not Found{% endblock %}

{% block content %}

<section class="error-page">

    <div class="container">

        <div class="error-card">

            <span class="error-code">
                404
            </span>

            <h1>
                Page not found
            </h1>

            <p>
                The requested page does not exist.
            </p>

            <a
                href="{{ url_for('index') }}"
                class="button button-primary"
            >
                Return Home
            </a>

        </div>

    </div>

</section>

{% endblock %}

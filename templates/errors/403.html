{% extends "base.html" %}

{% block title %}403 | Access Denied{% endblock %}

{% block content %}

<section class="error-page">

    <div class="container">

        <div class="error-card">

            <span class="error-code">
                403
            </span>

            <h1>
                Access denied
            </h1>

            <p>
                Your account does not have permission
                to access this resource.
            </p>

            <a
                href="{{ url_for('index') }}"
                class="button button-primary"
            >
                Return Home
            </a>

        </div>

    </div>

</section>

{% endblock %}
